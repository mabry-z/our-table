<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light only">
<meta name="theme-color" content="#F7F3EC">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Our table">
<title>Our table</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Lora:wght@500&family=Lato:wght@400;700&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="app">
  <main class="bd" id="body"><div class="mu" style="text-align:center;margin-top:40vh">Loading</div></main>
  <div class="dock" id="dock"></div>
  <nav class="tb" id="tabs" aria-label="Main"></nav>
  <div id="sheet"></div>
</div>
<script type="module" src="js/app.js"></script>
<script>
// If the app hasn't started after 10 seconds (usually old and new files mixed in the phone's
// cache right after an update), say so and offer a reload instead of "Loading" forever.
setTimeout(function () {
  var b = document.getElementById('body');
  if (b && b.textContent.trim() === 'Loading') {
    b.innerHTML = '<div class="cd" style="margin-top:30vh;text-align:center">The app didn’t start. If it was just updated, '
      + 'your phone may still have part of the old version for a few minutes.'
      + '<div style="margin-top:10px"><button class="ib" onclick="location.reload()">Try again</button></div></div>';
  }
}, 10000);
</script>
</body>
</html>

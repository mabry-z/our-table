<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="color-scheme" content="light"><title>Seed SQL</title>
<style>body{margin:0;padding:16px;background:#F7F3EC;color:#2F2B26;font:13px/1.5 ui-monospace,Consolas,monospace}pre{white-space:pre-wrap}</style>
</head><body>
<p>Generated from js/sample-data.js. Copy into supabase/seed.sql.</p>
<pre id="out"></pre>
<script type="module">
import { sampleRows } from '../js/sample-data.js';

// Insert order respects foreign keys. Members are linked separately (supabase/setup-members.sql).
const ORDER = ['households', 'stores', 'ingredients', 'products', 'prices', 'ingredient_matches',
  'recipes', 'plans', 'plan_meals', 'usuals', 'list_items', 'exchange_rates'];
const JSONB = new Set(['steps', 'cost_by_store']);
const UUID_ARRAYS = new Set(['default_store_ids', 'options']);
const q = s => "'" + String(s).replace(/'/g, "''") + "'";

function lit(col, v) {
  if (v === null || v === undefined) return 'null';
  if (JSONB.has(col)) return q(JSON.stringify(v)) + '::jsonb';
  if (Array.isArray(v)) return v.length ? `array[${v.map(q).join(', ')}]::${UUID_ARRAYS.has(col) ? 'uuid' : 'text'}[]` : "'{}'";
  if (typeof v === 'number' || typeof v === 'boolean') return String(v);
  return q(v);
}

const rows = sampleRows();
let sql = '-- Sample data matching the mockups. Generated by tools/seed.html from js/sample-data.js;\n'
  + '-- edit that file and regenerate rather than editing this one.\nbegin;\n';
for (const t of ORDER) {
  const list = rows[t];
  if (!list.length) continue;
  const cols = Object.keys(list[0]);
  sql += `\ninsert into public.${t} (${cols.join(', ')}) values\n`
    + list.map(r => '  (' + cols.map(c => lit(c, r[c])).join(', ') + ')').join(',\n') + ';\n';
}
sql += '\ncommit;\n';
document.getElementById('out').textContent = sql;
window.seedSql = sql;
</script>
</body></html>

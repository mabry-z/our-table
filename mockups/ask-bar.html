<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ask bar and results sheet</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3/dist/tabler-icons.min.css">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Lora:wght@500&family=Lato:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--surface-1:#ECE6DC;--font-sans:system-ui,-apple-system,"Segoe UI",sans-serif}
body{margin:0;padding:24px 12px;background:#E9E3D9;font-family:var(--font-sans)}
button,input{font-family:inherit}
.note{max-width:380px;margin:0 auto 10px;font:13px/1.5 var(--font-sans);color:#6B6157}
.where{max-width:380px;margin:0 auto 14px;font:13px/1.5 var(--font-sans);color:#4F463D;background:#F3EEE6;border:1px solid #DED5C7;border-radius:12px;padding:10px 12px}
.where i{font-style:normal;color:#6E5F48}
.ph{position:relative;max-width:380px;height:780px;margin:0 auto;background:#F7F3EC;border:1px solid #E4DCCF;border-radius:28px;font-family:Lato,var(--font-sans);font-size:15px;color:#2F2B26;overflow:hidden;display:flex;flex-direction:column}
.scr{flex:1;overflow-y:auto;padding:22px 18px 10px}
.sf{font-family:Lora,Georgia,serif;font-weight:500}
.dsp{font-family:'Cormorant Garamond',Georgia,serif;font-weight:600}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.cd{background:#FFFDF9;border:1px solid #E2D8C8;border-radius:14px;padding:12px 14px;margin-bottom:10px}
.dash{background:transparent;border-style:dashed}
.mu{color:#6B6157;font-size:13px}
.ey{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:#6B6157}
.ai-ey{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:#5A4C37;display:flex;align-items:center;gap:5px}
.pl{font-size:12px;padding:3px 9px;border-radius:999px;white-space:nowrap;display:inline-flex;align-items:center;gap:4px}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.ib{background:transparent;border:1px solid #D3C8B7;border-radius:999px;color:#4A433B;font-size:13px;padding:5px 11px;cursor:pointer;display:inline-flex;align-items:center;gap:5px;white-space:nowrap;flex-shrink:0}
.dk{background:#2F2B26;border-color:#2F2B26;color:#F7F3EC}
.lk{background:none;border:none;color:#6E5F48;font-size:12px;cursor:pointer;text-decoration:underline;text-underline-offset:3px;padding:4px}

.sh-f{border-top:1px solid #E4DCCF;padding:10px 14px 16px;background:#F7F3EC}

.pick:first-child{border-top:none}
.src{width:30px;height:30px;border-radius:8px;background:#F1ECE3;color:#6B6157;display:flex;align-items:center;justify-content:center;flex:none}
</style></head><body>
<p class="note"><b>Ask bar and results sheet</b> · Design proposal, fully clickable. Type anything in plain words; the mockup fakes the AI with simple keyword rules, so try the kinds of things below. Recipes are sample data.</p>
<div class="where" id="where"></div>
<div style="background:var(--surface-1);border-radius:12px;padding:1.25rem 0">
<div class="ph" id="app"></div>
</div>
<script>
const D=['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const pBox='<span class="pl" style="background:#EAE3D3;color:#5E5338"><i class="ti ti-book" aria-hidden="true"></i> From your box</span>';
const pNew='<span class="pl" style="background:#E3EAF0;color:#3F5566"><i class="ti ti-sparkles" aria-hidden="true"></i> New idea</span>';
const pLuke=t=>`<span class="pl" style="background:#EDE4EE;color:#5D4663"><i class="ti ti-heart" aria-hidden="true"></i> ${t}</span>`;
const pQuick=t=>`<span class="pl" style="background:#E8EEE0;color:#4F5E3E"><i class="ti ti-clock" aria-hidden="true"></i> ${t}</span>`;
const pPlain=t=>`<span class="pl" style="background:#F1ECE3;color:#6B6157">${t}</span>`;
const pLock='<span class="pl" style="background:#F1ECE3;color:#6B6157"><i class="ti ti-lock" aria-hidden="true"></i> Locked</span>';
function tags(t){return t.map(x=>{const i=x.indexOf(':'),k=i<0?x:x.slice(0,i),v=x.slice(i+1);return k==='lock'?pLock:k==='box'?pBox:k==='new'?pNew:k==='luke'?pLuke(v):k==='q'?pQuick(v):k==='link'?`<span class="pl" style="background:#F1ECE3;color:#6B6157"><i class="ti ti-link" aria-hidden="true"></i> ${v}</span>`:k==='photo'?'<span class="pl" style="background:#F1ECE3;color:#6B6157"><i class="ti ti-photo" aria-hidden="true"></i> From a photo</span>':k==='typed'?'<span class="pl" style="background:#F1ECE3;color:#6B6157"><i class="ti ti-pencil" aria-hidden="true"></i> Typed in</span>':''}).join('')}

// ---------- app state ----------
const W0=[{n:'Sausage and pepper pasta',t:['lock','luke:Plain pasta for Luke'],locked:1},{open:1},{open:1},{lo:1},{open:1},{open:1},{lo:1}];
let tab='plan',week=W0.map(x=>({...x})),toast='',draft='',photo=false,sheet=null,fbi=0,saved={};
const RB={n:'Chicken taco bowls',ing:['1½ lb chicken breast','2 cups cooked rice','1 can black beans','1 cup corn','½ cup sour cream','1 cup shredded cheddar','Salsa','Cilantro','1 tsp chili powder']};
let add=null,pickOpen=null,ai=true,linkDraft='';
let picks=[{n:'Sheet-pan gnocchi with sausage',src:'link',site:'budgetbytes.com',by:'Lydia',when:'on Tuesday'},{n:"Grandma's chicken and dumplings",src:'photo',by:'You',when:'yesterday'}];
const SRCI={link:'link',photo:'photo',typed:'pencil',box:'book'};
let recipeMods=[],box=[{n:'Chicken taco bowls',m:'35 min · ★★★★',open:1},{n:'Sausage and pepper pasta',m:'30 min · ★★★★★'},{n:'Oven fried chicken and corn',m:'50 min · ★★★★'},{n:'Sheet-pan chicken and potatoes',m:'35 min · ★★★★'}];

const CTX={
 plan:{label:'Next week',ph:'Ask about next week…',starters:[['calendar','Plan next week, light on pasta'],['run','Plan an easy week, soccer Thursday so something quick'],['sparkles','Something new for Saturday']],
  tips:'<b>Build it yourself:</b> tap <i>Add dinner</i> on any open night (recipe box, <i>Find a recipe</i>, a link, a screenshot or photo, or just type it), or tap a recipe in <i>This week\'s picks</i> to give it a day. <b>Or ask:</b> <i>find me a lemon caper fish dish for Thursday</i> · <i>plan next week, light on pasta</i> · then <i>make Friday fish</i> · <i>Thursday leftovers</i>. Tap an earlier ask in the trail to go back to it.'},
 recipes:{label:'Recipes',ph:'Find or make a recipe…',starters:[['camera',"What can I make with what's in my fridge?",1],['search','Find a crockpot chili Luke might eat'],['sparkles','Make a sheet-pan dinner with chicken, peppers and rice']],
  tips:'Try: <i>find a crockpot chili</i> · then <i>no dairy</i> · <i>under 30 minutes</i>. Or <i>make something with pork, apples and potatoes</i> · then <i>milder</i> · <i>double it</i>. Or tap the camera for the fridge photo.'},
 recipe:{label:'Chicken taco bowls',ph:'Change this recipe…',starters:[['droplet-off','Make it dairy-free'],['copy','Double it'],['heart','Make it milder for Luke']],
  tips:'Try: <i>make it dairy-free</i> · <i>no cilantro</i> · <i>use ground turkey</i> · <i>double it</i>. Each ask adds to the list of changes; nothing is saved until you choose.'},
 list:{tips:'The List tab is not part of this mockup. The Ask bar lives on Plan, Recipes and each recipe page.'},
 settings:{tips:'<b>Settings tab, "AI helper" section.</b> Turn <i>AI suggestions</i> off and the Ask bar disappears everywhere. Adding dinners by link, photo or typing still works, and reading a photo still uses AI behind the scenes.'}};

// ---------- fake AI: plan ----------
const KW=[[/fish|salmon|seafood/i,'Lemon garlic salmon and rice',['new','q:25 min'],4],[/vegetarian|veggie|meatless/i,'Black bean and sweet potato tacos',['new','luke:Plain quesadilla for Luke'],2],[/leftover/i,'LO',[],3],
 [/slow.?cooker|crock/i,'Slow-cooker chicken chili',['new'],5],[/soup/i,'Chicken and rice soup',['box'],2],[/luke|kid/i,'Crispy chicken tenders and fries',['box','luke:Luke eats this too'],5],
 [/quick|fast|easy|soccer|busy/i,'Honey garlic chicken bites',['new','q:20 min'],1],[/beef|steak/i,'Beef and broccoli stir-fry',['new','q:25 min'],5],[/pork|schnitzel|german/i,'Pork schnitzel and spätzle',['box'],5],[/chicken/i,'Chicken pot pie skillet',['box'],5]];
const FB=[['Turkey taco bowls',['box','luke:Build-your-own']],['Shrimp fried rice',['new','q:25 min']],['Greek chicken pitas',['new']]];
function modWeek(wk,q){
 const dm=q.match(/\b(mon|tues?|wed|thur?s?|fri|sat|sun)(day|nesday|urday)?\b/i);
 const d=dm?['mon','tue','wed','thu','fri','sat','sun'].indexOf(dm[1].slice(0,3).toLowerCase()):-1;
 const k=KW.find(x=>x[0].test(q));
 if(d<0&&!k)return null;
 const day=d>=0?d:k[3];
 if(wk[day].locked)return{wk,msg:`${D[day]} is locked, so I left it alone. Unlock it on the plan to change it.`};
 const w=wk.map(x=>({...x}));
 if(k&&k[1]==='LO'){w[day]={lo:1};return{wk:w,msg:`${D[day]} is now a leftovers night.`,hi:day}}
 const [n,t]=k?[k[1],k[2]]:FB[fbi++%FB.length];
 w[day]={n,t};return{wk:w,msg:`${D[day]} is now ${n.charAt(0).toLowerCase()+n.slice(1)}.`,hi:day};
}
function noPasta(w){if(w[5].n&&/ragù|pasta/i.test(w[5].n)){w[5]={n:'Beef and broccoli stir-fry',t:['new','q:25 min']};return true}return false}
function askPlan(q,ph,prev){
 if(!ph&&/\b(find|search|look (for|up))\b/i.test(q)){
  let d=dayOf(q);if(d<0||week[d].locked)d=week.findIndex(x=>x.open);if(d<0)d=5;
  return found(q,d);
 }
 if(prev&&prev.kind==='found'&&!/plan (next|the|an|a)|start over/i.test(q)){const d=dayOf(q);const r=refineFound(prev,q);if(d>=0&&!week[d].locked){r.day=d;r.msg+=` For ${D[d]}.`}return r}
 if(prev&&prev.kind==='found')prev=null;
 let wk,msgs=[],hi=null;
 const fresh=!prev||/start over|new plan|replan|plan (next|the|an|a)/i.test(q);
 if(fresh){
  wk=week.map((x,i)=>x.open?[null,{n:'Sheet-pan chicken and potatoes',t:['box','q:35 min']},{n:'Oven fried chicken and corn',t:['box','luke:Luke eats this too']},null,{n:'Chicken fajita skillet',t:['box','q:30 min']},{n:'Slow-cooker beef ragù',t:['new','luke:Plain pasta for Luke']},null][i]:{...x});
  msgs.push(ph?'Built around the chicken, peppers and rice in your photo. Monday stays as it is.':'Three from your box and one new idea. Tuesday and Friday share the chicken thighs and peppers, so nothing goes to waste.');
 }else wk=prev.wk.map(x=>({...x}));
 if(/pasta/i.test(q)&&/light|less|no |fewer|without|not/i.test(q)&&noPasta(wk)){msgs.push('Only Monday has pasta now: Saturday is beef and broccoli stir-fry.');hi=5}
 const m=modWeek(wk,fresh?q.replace(/plan (next|the|an|a)\s*\w*\s*week/i,''):q);
 if(m){wk=m.wk;msgs.push(m.msg);if(m.hi!=null)hi=m.hi}
 if(!msgs.length)msgs.push("I wasn't sure which night to change. Try naming a day or a kind of dinner, like “make Friday fish”.");
 return{kind:'week',wk,msg:msgs.join(' '),hi};
}

// ---------- fake AI: recipes ----------
const POOLS={chili:[['Slow-cooker white chicken chili','allrecipes.com','6 hr · 15 min prep','Mild',1],['Easy crockpot beef chili','budgetbytes.com','8 hr · 20 min prep','Freezes well',0],['Three-bean slow-cooker chili','simplyrecipes.com','6 hr · 15 min prep','Vegetarian',0]],
 chicken:[['One-pan crispy chicken tenders','allrecipes.com','30 min','4.7 · 2,100 ratings',1],['Chicken and broccoli rice bake','budgetbytes.com','45 min','Freezes well',1],['Honey garlic chicken bites','simplyrecipes.com','25 min','Kid favorite',0]],
 pasta:[['One-pot sausage pasta','allrecipes.com','30 min','4.8 · 900 ratings',1],['Baked ziti','budgetbytes.com','50 min','Feeds a crowd',1],['Lemon chicken orzo','simplyrecipes.com','30 min','Light',0]],
 fish:[['Pan-seared cod with lemon caper butter','seriouseats.com','25 min','4.8 · 640 ratings',0],['Baked salmon with lemon and capers','allrecipes.com','30 min','One pan',0],['Fish piccata','simplyrecipes.com','20 min','Weeknight favorite',0]],
 def:[['Turkey taco bowls','allrecipes.com','30 min','Build-your-own',1],['Sheet-pan gnocchi and vegetables','budgetbytes.com','35 min','One pan',0],['Honey garlic pork chops','simplyrecipes.com','25 min','4.6 · 1,300 ratings',0]]};
const DAYRE=/\b(mon|tues?|wed|thur?s?|fri|sat|sun)(day|nesday|urday)?\b/i;
function dayOf(q){const m=q.match(DAYRE);return m?['mon','tue','wed','thu','fri','sat','sun'].indexOf(m[1].slice(0,3).toLowerCase()):-1}
function found(q,day){const k=/fish|salmon|cod|caper|piccata|tilapia|halibut|shrimp/i.test(q)?'fish':/chili/i.test(q)?'chili':/chicken/i.test(q)?'chicken':/pasta|ziti|spaghetti/i.test(q)?'pasta':'def';
 const what=q.replace(/^(find|search( for)?|look (for|up))\s+(me\s+)?(an?\s+)?/i,'').replace(/\s*\b(for|on)\s+\w+day\b/i,'').replace(/\s*\b\w+day\b/i,'');
 return{kind:'found',day,items:POOLS[k].map(([n,site,t,note,luke])=>({n,site,t,note,luke})),msg:`Searched 3 recipe sites for “${esc(what)}”${day!=null?` for ${D[day]}`:''}.`}}
function refineFound(prev,q){
 let items=prev.items.map(x=>({...x})),did=[];
 if(/dairy/i.test(q)){items=items.slice(0,2).map(x=>({...x,note:'Dairy-free'}));did.push('dairy-free')}
 const mm=q.match(/under\s*(\d+)/i);if(mm||/quick|fast/i.test(q)){const lim=mm?+mm[1]:30;items=items.map(x=>({...x,t:/^\d+ min$/.test(x.t)&&parseInt(x.t)<lim?x.t:`${lim-5} min`}));did.push(mm?`under ${mm[1]} minutes`:'quicker')}
 if(/air.?fryer/i.test(q)){items=items.map(x=>({...x,n:'Air fryer '+x.n.charAt(0).toLowerCase()+x.n.slice(1)}));did.push('air fryer')}
 if(/luke|kid|mild/i.test(q)){items=items.map(x=>({...x,luke:1,note:'Mild'}));did.push('Luke-friendly')}
 if(/vegetarian|veggie/i.test(q)){items=items.map(x=>({...x,n:x.n.replace(/chicken|beef|pork|turkey|sausage/i,'chickpea'),note:'Vegetarian'}));did.push('vegetarian')}
 if(!did.length)return found(q,prev.day);
 return{kind:'found',day:prev.day,items,msg:`Narrowed to ${did.join(', ')}.`};
}
function created(q,list){
 let ing=list;
 if(!ing){const m=q.match(/(?:with|using|have|from)\s+(.+)/i);ing=m?m[1].replace(/[.?!]/g,'').split(/,|\band\b/).map(s=>s.trim()).filter(Boolean):['chicken thighs','bell peppers','rice']}
 const a=ing[0]||'chicken',b=ing[1]||'vegetables';
 const n=/sheet.?pan/i.test(q)?`Sheet-pan ${a} with ${b}`:/soup/i.test(q)?cap(`${a} and ${b} soup`):/pasta/i.test(q)?cap(`${a} and ${b} pasta`):/slow|crock/i.test(q)?`Slow-cooker ${a} and ${b}`:cap(`${a} and ${b} skillet`);
 const amt=['1½ lb','3','1½ cups','1 can','2 cups','1','½ cup','2'];
 return{kind:'created',n,time:35,portions:4,ing:ing.slice(0,6).map((x,i)=>`${amt[i]} ${x}`),changes:[],msg:`Uses ${ing.length} of your items. Nothing else to buy beyond pantry staples.`};
}
function refineCreated(prev,q){
 const r={...prev,ing:[...prev.ing],changes:[...prev.changes]};
 if(/mild|luke|kid/i.test(q)){r.n+=', mild';r.changes.push('Spices cut back; plain portion set aside for Luke at step 3')}
 if(/dairy/i.test(q))r.changes.push('Cheese left off; yogurt sauce becomes lime avocado');
 if(/double/i.test(q)){r.portions=8;r.changes.push('Doubled to 8 portions')}
 if(/slow|crock/i.test(q)){r.n='Slow-cooker '+r.n.charAt(0).toLowerCase()+r.n.slice(1);r.time=360;r.changes.push('Moved to the slow cooker, 6 hours on low')}
 if(/quick|faster|under/i.test(q)){r.time=25;r.changes.push('Cut to 25 minutes: thinner slices, higher heat')}
 if(/spic/i.test(q))r.changes.push('Added chipotle and chili flakes');
 if(r.changes.length===prev.changes.length)r.changes.push(`Adjusted: “${esc(q)}”`);
 r.msg='Updated the recipe.';return r;
}
const SEEN=['Chicken thighs','Bell peppers (3)','Half an onion','Rice','Canned tomatoes','Cheddar','Eggs','Greek yogurt'];
function askRecipes(q,ph,prev){
 if(ph)return{kind:'seen',items:SEEN.map(n=>({n,on:1})),msg:'Here is what I can see. Tap anything that is wrong or used up, or tell me what I missed.'};
 if(prev&&prev.kind==='seen'){const r={...prev,items:prev.items.map(x=>({...x}))};
  if(/\b(no|not|out of|remove|used up)\b/i.test(q)){const w=q.replace(/.*\b(no|not|out of|remove|used up)\b\s*/i,'').toLowerCase();const it=r.items.find(x=>x.n.toLowerCase().includes(w.split(' ')[0]));if(it)it.on=0;r.msg=it?`Took off ${it.n.toLowerCase()}.`:'I could not find that one in the list.'}
  else{const add=q.replace(/^(also|and|plus|we have|i have|add)\s*/i,'').replace(/^(also have|have)\s*/i,'');add.split(/,|\band\b/).map(s=>s.trim()).filter(Boolean).forEach(n=>r.items.push({n:cap(n),on:1}));r.msg='Added. Anything else, or ready for ideas?'}
  return r}
 const refineable=prev&&(prev.kind==='found'||prev.kind==='created')&&!/^(find|search|make|create)\b/i.test(q);
 if(refineable)return prev.kind==='found'?refineFound(prev,q):refineCreated(prev,q);
 if(/\b(make|create|invent|cook)\b|\bwith\b|using|fridge|have/i.test(q)&&!/^find|^search/i.test(q))return created(q);
 return found(q);
}
function ideasFrom(prev){const on=prev.items.filter(x=>x.on).map(x=>x.n.replace(/\s*\(.*\)/,'').toLowerCase());

// ---------- fake AI: one recipe ----------
const RULES=[[/dairy/i,'dairy-free',[['½ cup sour cream','Lime avocado crema (1 avocado, 1 lime)'],['1 cup shredded cheddar',null]]],[/double/i,'doubled',[['All amounts','Doubled for 8 portions']]],

 [/turkey/i,'turkey',[['1½ lb chicken breast','1½ lb ground turkey']]],[/vegetarian|veggie/i,'vegetarian',[['1½ lb chicken breast','Roasted sweet potato and a second can of beans']]]];
function askRecipe(q,ph,prev){
 const r=prev?{...prev,list:[...prev.list],suffix:[...prev.suffix]}:{kind:'changes',list:[],suffix:[]};
 const hit=RULES.filter(x=>x[0].test(q));
 hit.forEach(([,s,l])=>{r.suffix.push(s);l.forEach(([f,t])=>{if(!r.list.some(c=>c.from===f))r.list.push({from:f,to:t})})});
 if(!hit.length)r.list.push({from:null,to:`Note added: “${esc(q)}”`});
 r.msg=hit.length?`Here is what changes${r.list.some(c=>/step/i.test(c.to||''))?'':', and step 5 is updated to match'}.`:'I added that as a note on the recipe.';
 return r;
}

 if(s==='link')b+=`<div class="lbl">Recipe link</div><div style="display:flex;gap:6px"><input id="linkin" class="in" placeholder="budgetbytes.com/one-pot-chili-mac" value="${esc(linkDraft)}" aria-label="Recipe link"><button class="ib dk" data-a="linkgo">Import</button></div>${add.err?`<div class="flag"><i class="ti ti-alert-circle" aria-hidden="true"></i>${add.err}</div>`:''}<div class="mu" style="margin-top:8px">Most recipe sites build the recipe into the page, so this usually needs no AI. Leave it blank to try the sample link.</div>`;
 if(s==='photo')b+=`<button class="starter" data-a="photopick"><i class="ti ti-photo" aria-hidden="true"></i><span style="flex:1">Choose a photo<br><span class="mu">Sample: a handwritten recipe card</span></span></button>
  <button class="starter" data-a="photomany"><i class="ti ti-photo-plus" aria-hidden="true"></i><span style="flex:1">Choose several<br><span class="mu">Each screenshot becomes its own pick</span></span></button>
  <button class="starter"><i class="ti ti-camera" aria-hidden="true"></i><span style="flex:1">Take a photo<br><span class="mu">Of a cookbook page or recipe card</span></span></button>`;
 if(s==='type')b+=`<div class="lbl">Dinner</div><input id="tyname" class="fld" placeholder="e.g. Tacos" aria-label="Dinner name"><div class="lbl">Ingredients, optional</div><textarea id="tying" class="fld" rows="4" placeholder="One per line, so they go on the list" aria-label="Ingredients"></textarea>${add.err?`<div class="flag"><i class="ti ti-alert-circle" aria-hidden="true"></i>${add.err}</div>`:''}<button class="ib dk" data-a="typego" style="width:100%;justify-content:center;padding:10px;font-size:13px;margin-top:12px">${add.target==='picks'?'Add to picks':'Add to '+D[add.target]}</button>`;
 if(s==='loading')b+=`<div class="cd pulse"><div class="ey">Working</div><div class="sf" style="font-size:18px;margin-top:4px">${add.msg}</div></div>`;
 if(s==='preview'){const p=add.pv;
  b+=`<div class="mu" style="margin:0 2px 8px">Check it over. You can fix anything before it's saved.</div><div class="cd"><div class="ey">${p.site?p.site:'From your photo'} · ${p.time} · serves 4</div>
  <div class="lbl">Name</div><input id="pvtitle" class="fld" value="${esc(p.n)}" aria-label="Recipe name" style="font:500 19px 'Cormorant Garamond',Georgia,serif">
  <div class="lbl">Ingredients · ${p.ing.length}</div><textarea id="pving" class="fld" rows="${p.ing.length}" aria-label="Ingredients">${esc(p.ing.join('\n'))}</textarea>
  ${p.flag?`<div class="flag"><i class="ti ti-alert-circle" aria-hidden="true"></i><span>${p.flag}</span></div>`:''}
  <div class="mu" style="margin-top:8px">6 steps · ${p.via}</div></div>
  <div style="display:flex;gap:8px">${add.target==='picks'?`<button class="ib dk" data-a="place" style="flex:1;justify-content:center;padding:10px">Add to picks</button>`:`<button class="ib" data-a="topicks" style="flex:1;justify-content:center;padding:10px">Save to picks instead</button><button class="ib dk" data-a="place" style="flex:1;justify-content:center;padding:10px">Add to ${D[add.target]}</button>`}</div>`;
 }
 return `<div class="ov" data-a="addclose"></div><div class="sheet" role="dialog" aria-label="Add dinner"><div class="grab"></div>
 <div class="sh-h row"><div class="row" style="gap:4px">${s!=='menu'&&s!=='loading'?'<button class="ib" data-a="addback" aria-label="Back" style="border:none;padding:4px"><i class="ti ti-chevron-left" style="font-size:18px" aria-hidden="true"></i></button>':''}<div class="ey" style="color:#2F2B26">Add to ${tgt}</div></div><button class="ib" data-a="addclose" aria-label="Close" style="border:none;padding:4px 6px"><i class="ti ti-x" style="font-size:18px" aria-hidden="true"></i></button></div>
 <div class="sh-b">${b}</div></div>`}
function srcTags(src,site){return src==='link'?['link:'+site]:src==='box'?['box']:[src]}
function put(target,n,src,site,toPicks){
 if(toPicks||target==='picks'){picks.push({n,src,site,by:'You',when:'just now'});toast=`${n} added to this week's picks`}
 else{week[target]={n,t:srcTags(src,site)};toast=`${n} is on ${D[target]} · ingredients added to the list`}
 if(src!=='box'&&!box.some(r=>r.n===n))box.unshift({n,m:src==='typed'?'typed in':src==='link'?site:'from a photo'});
 add=null;
}
function addLoad(msg,ms,then){add.step='loading';add.msg=msg;render();setTimeout(()=>{then();render()},ms)}

function render(){
 const ctxTab=tab==='recipe'?'recipes':tab;
 document.getElementById('where').innerHTML=`<b>${{plan:'Plan tab',recipes:'Recipes tab',recipe:'Recipe page',list:'List tab',settings:'Settings tab'}[tab]}.</b> ${CTX[tab].tips}`;
 const v={plan:vPlan,recipes:vRecipes,recipe:vRecipe,list:()=>vOther('List'),settings:vSettings}[tab]();
 const bar=CTX[tab].ph&&ai?`<div class="askbar" data-a="open"><i class="ti ti-sparkles" style="color:#8A7B63" aria-hidden="true"></i><span>${CTX[tab].ph}</span><button class="round" data-a="openphoto" aria-label="Ask with a photo"><i class="ti ti-camera" aria-hidden="true"></i></button></div>`:'';
 document.getElementById('app').innerHTML=`<div class="scr">${v}</div>${bar}<div class="tabs">${[['plan','calendar','Plan'],['recipes','book','Recipes'],['list','list-check','List'],['settings','settings','Settings']].map(([k,i,l])=>`<button class="tab ${k===ctxTab?'on':''}" data-tab="${k}"><i class="ti ti-${i}" aria-hidden="true"></i>${l}</button>`).join('')}</div>${sheet?sheetH():''}${add?addSheetH():''}`;
 const fi=document.getElementById('findin');
 if(fi)fi.onkeydown=e=>{if(e.key==='Enter')act('findgo')};
 const li=document.getElementById('linkin');
 if(li){li.oninput=e=>{linkDraft=e.target.value};li.onkeydown=e=>{if(e.key==='Enter')act('linkgo')}}
 const a=document.getElementById('ask');
 if(a){a.oninput=e=>{draft=e.target.value};a.onkeydown=e=>{if(e.key==='Enter')send()}}
 document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;toast='';sheet=null;render()});
 document.querySelectorAll('[data-a]').forEach(b=>b.onclick=e=>{e.stopPropagation();act(b.dataset.a,+b.dataset.i)});
}
function act(a,i){
 const r=last();
 switch(a){
  case 'open':openSheet(false);return;
  case 'openphoto':openSheet(true);return;
  case 'close':sheet=null;photo=false;draft='';break;
  case 'fresh':sheet.trail=[];draft='';photo=false;break;
  case 'send':send();return;
  case 'photo':photo=!photo;break;
  case 'starter':{const s=CTX[sheet.ctx].starters[i];draft=s[1];photo=!!s[2];render();focusAsk();return}
  case 'back':sheet.trail=sheet.trail.slice(0,i+1);break;
  case 'applyweek':week=r.wk.map(x=>({...x}));sheet=null;toast='Week saved · 23 items added to the list';break;
  case 'save':saved[r.items[i].n]=1;box.unshift({n:r.items[i].n,m:`${r.items[i].t} · ${r.items[i].site}`});break;
  case 'addweek':{const x=r.items[i],d=r.day!=null?r.day:5;saved['w'+x.n]=1;week[d]={n:x.n,t:['link:'+x.site]};if(!box.some(b=>b.n===x.n))box.unshift({n:x.n,m:`${x.t} · ${x.site}`});break}
  case 'savec':saved[r.n]=1;box.unshift({n:r.n,m:`${r.time} min · created`});break;
  case 'addweekc':saved['w'+r.n]=1;week[5]={n:r.n,t:['new']};break;
  case 'toggleseen':r.items[i].on=r.items[i].on?0:1;break;
  case 'ideas':push('Show ideas',ideasFrom(r));break;
  case 'make':{const x=r.items[i],c=created('',r.on.slice(0,x.uses));c.n=x.n;c.msg=`Uses ${x.uses} of your items. ${x.need}.`;push(`Make ${x.n.charAt(0).toLowerCase()+x.n.slice(1)}`,c);break}
  case 'copy':box.unshift({n:`Chicken taco bowls, ${r.suffix.join(', ')||'with notes'}`,m:'35 min · copy'});sheet=null;toast=`Saved as “Chicken taco bowls, ${r.suffix.join(', ')||'with notes'}”`;break;
  case 'replace':recipeMods=r.list.filter(c=>c.from);sheet=null;toast='Recipe updated';break;
  case 'adddinner':add={target:i,step:'menu'};pickOpen=null;break;
  case 'addpick':add={target:'picks',step:'menu'};break;
  case 'addopt':add.step=['box','find','link','photo','type'][i];add.err='';add.res=null;add.q='';break;
  case 'findgo':{const q=(document.getElementById('findin').value.trim())||'lemon caper fish';addLoad('Searching recipe sites…',900,()=>{add.step='find';add.q=q;add.res=found(q)});return}
  case 'findref':{const c=['under 30 minutes','Luke-friendly','dairy-free'][i];addLoad('Narrowing it down…',600,()=>{add.step='find';add.res=refineFound(add.res,c)});return}
  case 'findput':{const x=add.res.items[i];put(add.target,x.n,'link',x.site);break}
  case 'addback':add.step=add.step==='preview'?(add.pv.src==='link'?'link':'photo'):'menu';add.err='';break;
  case 'addclose':add=null;break;
  case 'boxpick':put(add.target,box[i].n,'box');break;
  case 'frompick':{const p=picks.splice(i,1)[0];put(add.target,p.n,p.src,p.site);break}
  case 'linkgo':{const pv=fromUrl(linkDraft.trim()||'https://www.budgetbytes.com/one-pot-chili-mac/');if(!pv){add.err="That doesn't look like a link. Copy the address from the recipe page and paste it here.";break}
   linkDraft='';addLoad('Reading the recipe…',700,()=>{add.step='preview';add.pv=pv});return}
  case 'photopick':addLoad('Reading your photo…',1200,()=>{add.step='preview';add.pv={...PHOTO}});return;
  case 'photomany':addLoad('Reading 3 screenshots…',1400,()=>{['Crispy honey garlic chicken','Lemon orzo with peas','Turkey taco lettuce wraps'].forEach(n=>picks.push({n,src:'photo',by:'You',when:'just now'}));toast="3 recipes added to this week's picks";add=null});return;
  case 'typego':{const n=document.getElementById('tyname').value.trim();if(!n){add.err='Give the dinner a name first.';break}put(add.target,cap(n),'typed');break}
  case 'place':case 'topicks':{const n=document.getElementById('pvtitle').value.trim()||add.pv.n;put(add.target,n,add.pv.src,add.pv.site,a==='topicks');break}
  case 'pickopen':pickOpen=pickOpen===i?null:i;break;
  case 'pickto':{const p=picks.splice(pickOpen,1)[0];week[i]={n:p.n,t:srcTags(p.src,p.site)};pickOpen=null;toast=`${p.n} is on ${D[i]} · ingredients added to the list`;break}
  case 'pickremove':picks.splice(i,1);pickOpen=null;break;
  case 'toggleai':ai=!ai;toast=ai?'AI suggestions are on':'AI suggestions are off. The Ask bar is hidden';break;
  case 'openrecipe':tab='recipe';toast='';break;
  case 'backrecipes':tab='recipes';toast='';break;
 }
 render();
}
render();
</script>
</body></html>
